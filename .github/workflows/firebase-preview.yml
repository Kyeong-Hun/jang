
name: Jangilgi Firebase Preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: jangilgi-f8d8d
          workload_identity_provider: projects/1020090355653/locations/global/workloadIdentityPools/jang-github-pool/providers/jang-github-provider
          service_account: jang-github-deploy@jangilgi-f8d8d.iam.gserviceaccount.com

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Deploy Firebase preview
        run: npx --yes firebase-tools@15.34.1 hosting:channel:deploy test --project jangilgi-f8d8d --expires 7d --non-interactive
